# Build and test on every push to main and on pull requests, on Windows and Linux.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # MinVer needs the tags
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build Xen.Utils.ApiKeyMinting.slnx -c Release
      - run: dotnet test Xen.Utils.ApiKeyMinting.slnx -c Release --no-build
